name: CI

on:
  push:
  pull_request:
    branches: [ "v6" ]

jobs:
  headless-tests:
    name: Headless Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "11.6.0"

      - name: Setup Takumi Guard
        uses: flatt-security/setup-takumi-guard-npm@9a5d797c2085b6326d3a2985c08e3a114b9b88c1 # v1.1.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm ci

      - name: Build
        run: pnpm run ci

      - name: Lint
        run: pnpm run tinymce-grunt eslint

      - name: Install Chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        id: setup-chrome
        with:
          chrome-version: 147
          install-chromedriver: true
          install-dependencies: true

      - name: Configure Chrome and ChromeDriver paths
        run: |
          sudo ln -sf "${{ steps.setup-chrome.outputs.chrome-path }}" /opt/google/chrome/chrome
          echo "$(dirname ${{ steps.setup-chrome.outputs.chromedriver-path }})" >> $GITHUB_PATH

      - name: Build tinymce bundle
        run: pnpm run tinymce-grunt rollup

      - name: Run headless tests
        run: pnpm run headless-test

      - name: Run TinyMCE tests
        run: pnpm run tinymce-grunt bedrock-auto:standard
